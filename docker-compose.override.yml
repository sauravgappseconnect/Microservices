services:
  commandservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__db=Server=sql2,1433;Database=commandservice;User Id=sa;Password=@Bcd.1234;TrustServerCertificate=True
      - ServiceBus__QueueName=PlatformEvent
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=true
      - TelemetryUrl=http://otel-collector:4317
    ports:
      - "5279:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
 
  platformservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__db=Server=sql2,1433;Database=platformservice;User Id=sa;Password=@Bcd.1234;TrustServerCertificate=True
      - ServiceBus__QueueName=PlatformEvent 
      - TelemetryUrl=http://otel-collector:4317
    ports:
      - "5136:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro

  api-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - TelemetryUrl=http://otel-collector:4317
      - AllowedOrigins__0=http://localhost:3000
    ports:
        - "5291:8080"
