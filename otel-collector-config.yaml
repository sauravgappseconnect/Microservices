receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s    # Maximum time to wait before sending a batch
    send_batch_size: 1024  # Number of spans per batch

exporters:
  debug:
    verbosity: detailed

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:9464"   # Collector exposes metrics here

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlphttp/loki]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
